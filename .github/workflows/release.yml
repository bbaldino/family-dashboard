name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so a post-merge run cannot race the run that spawned it.
# cancel-in-progress MUST be false — cancelling mid-release can interrupt tag
# creation.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Gated so a red main opens no release PR, and therefore cuts no tag. Every
  # release-bot run pays for the suite; that is the correct trade against
  # tagging code that does not build.
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # NOT the default GITHUB_TOKEN. A tag pushed with it does not trigger
          # other workflows — GitHub suppresses that to prevent recursive runs —
          # so publish-image would never fire and no image would be built, with
          # nothing reporting an error.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Merging the release PR is what cuts the tag, so it happens immediately
      # rather than waiting for a human.
      #
      # This queries for an open release PR rather than gating on
      # `prs_created`. That output is true only when the PR is *created*, not
      # when it is updated — so after any single failed merge, every later push
      # would update the existing PR, skip this step, and the repo would stop
      # releasing while every run stayed green. Querying makes the step
      # idempotent and self-healing.
      #
      # `--repo` is required, not decorative: release-please works entirely
      # through the API and does no checkout, so `gh` has no git remote to infer
      # the target from and would die with "not a git repository".
      - name: Auto-merge the release PR
        env:
          # Must be RELEASE_BOT_TOKEN. A merge performed with GITHUB_TOKEN does
          # not trigger the follow-up run that cuts the tag — the same silent
          # failure as tagging with it.
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          pr=$(gh pr list --repo "${{ github.repository }}" --state open --json number,title \
                --jq 'map(select(.title | test("^chore(\\(.+\\))?: release "))) | .[0].number // empty')
          if [ -z "$pr" ]; then echo "no open release PR"; exit 0; fi
          gh pr merge --squash --delete-branch --repo "${{ github.repository }}" "$pr"
